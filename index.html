<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d77">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>My Daily Tracker</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--tx:#1d2b2a;--mu:#6b7c7a;--pr:#2f7d77;--pc:#d9efec;--ok:#2e9e5b;--wa:#d98a1f;--er:#c9483f;--bd:#dfe8e6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101615;--card:#1a2322;--tx:#e6f0ee;--mu:#93a8a5;--pr:#4fb0a8;--pc:#21423f;--bd:#2a3836;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101615;--card:#1a2322;--tx:#e6f0ee;--mu:#93a8a5;--pr:#4fb0a8;--pc:#21423f;--bd:#2a3836;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;padding-bottom:84px}
#v{padding:14px;max-width:640px;margin:auto}
h3{margin:18px 0 8px;font-size:1.05rem}
.card,.row{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0}
.row{display:flex;align-items:center;gap:10px;cursor:pointer}
.row.done{opacity:.65}.row.done b{text-decoration:line-through}
.g{flex:1;min-width:0;display:flex;flex-direction:column}
small,.mu{color:var(--mu)}
.ic{font-size:1.4rem}
.tag{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--pc);white-space:nowrap}
.t-done{background:var(--ok);color:#fff}.t-doing{background:var(--wa);color:#fff}.t-later{background:var(--er);color:#fff}
.hero{background:var(--pr);color:#fff;border-radius:18px;padding:18px;text-align:center}
.clk{font-size:2.6rem;font-weight:700;direction:ltr;font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--pc);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--pr)}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px}
button.pb,button.on{background:var(--pr);color:#fff;border-color:var(--pr)}button.dg{color:var(--er)}
.seg,.chips,.rw{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.rw>*{flex:1}
label{display:block;margin:8px 0;font-size:.9rem;color:var(--mu)}
input,select,textarea{width:100%;font:inherit;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin-top:4px}
input[type=checkbox]{width:22px;height:22px;margin:0;accent-color:var(--pr)}
.ck{display:flex;align-items:center;gap:8px}.card.ck{color:var(--tx);font-size:1rem}
#nav{position:fixed;inset:auto 0 0 0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;border:0;border-radius:0;background:none;font-size:.7rem;padding:8px 2px;display:flex;flex-direction:column;align-items:center;color:var(--mu)}
#nav button.on{color:var(--pr);background:none}#nav i{font-style:normal;font-size:1.3rem}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:9}
.box{background:var(--card);width:100%;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:640px;margin:auto}
#toast{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;background:var(--pr);color:#fff;padding:10px 14px;border-radius:12px;gap:8px;align-items:center;z-index:20}
#toast span{flex:1}#toast button{background:#fff3;color:#fff;border:0}
.nv{display:flex;align-items:center;justify-content:space-between;gap:8px}
</style>
</head>
<body>
<main id="v"></main><nav id="nav"></nav><div id="toast"></div><div id="sh"></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),m=(h,i=0)=>h*60+i;
const fm=x=>pad(Math.floor(x/60))+':'+pad(x%60),pt=v=>{const[a,b]=v.split(':');return +a*60+ +b};
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const CATS={uni:['🎓','الجامعة'],study:['📚','مراجعة'],language:['🗣️','لغات'],tech:['💻','تقني'],gym:['🏋️','رياضة'],rest:['☕','راحة'],prayer:['🕌','صلاة'],free:['🎈','وقت حر'],sleep:['🌙','نوم'],other:['📌','أخرى']};
const MODS=['DAWS','FDMS','IRDM','BDSM','OWS','PEW','SIS'],KINDS=['Cours','TD','TP'];
const ST={todo:'لم يبدأ',doing:'قيد الإنجاز',done:'مكتمل',later:'مؤجل'},SD=[0,1,2,3,4],KEY='mdt_v1';
const defAct=()=>[['الخروج إلى الجامعة والجامعة والتنقل','uni',7,0,15,0],['الغداء والراحة والصلاة','rest',15,0,16,0],['مراجعة دروس الجامعة','study',16,0,17,15],['تعلم اللغة الفرنسية','language',17,15,17,45],['راحة','rest',17,45,18,15],['نشاط تقني أو رياضة','tech',18,15,19,15],['العشاء والصلاة والراحة','rest',19,15,20,30],['مراجعة خفيفة','study',20,30,21,0],['وقت حر أو تحضير لليوم التالي','free',21,0,22,30],['الاستعداد للنوم','sleep',22,30,23,0],['النوم','sleep',23,0,23,59],['الاستيقاظ والفطور','rest',8,0,9,0,[5,6]],['مراجعة دروس الجامعة','study',9,0,11,0,[5,6]],['راحة','rest',11,0,11,30,[5,6]],['تعلم اللغة الفرنسية','language',11,30,12,0,[5,6]],['الغداء والصلاة والراحة','rest',13,0,14,30,[5,6]],['نشاط تقني','tech',15,0,16,30,[5,6]],['رياضة','gym',17,0,18,15,[5,6]],['العشاء والصلاة','rest',19,15,20,30,[5,6]],['مراجعة خفيفة وتحضير للأسبوع','study',20,30,21,30,[5,6]],['وقت حر','free',21,30,22,30,[5,6]],['الاستعداد للنوم','sleep',22,30,23,0,[5,6]],['النوم','sleep',23,0,23,59,[5,6]]].map((a,i)=>({id:'a'+i,t:a[0],c:a[1],s:m(a[2],a[3]),e:m(a[4],a[5]),d:[...(a[6]||SD)],n:true,mod:'',k:''}));
const defS=()=>({acts:defAct(),log:{},hab:[{id:'h0',t:'الصلاة'},{id:'h1',t:'قراءة القرآن'},{id:'h2',t:'النوم في الوقت المحدد'},{id:'h3',t:'المشي أو النشاط البدني'}],hl:{},jr:[],gp:{6:'Upper',0:'Lower',2:'Upper',3:'Lower'},set:{lead:10,quiet:true,qs:'23:00',qe:'06:00',notif:true}});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.acts)S=defS();
if(!S.v){const have=new Set(S.acts.map(a=>a.id));defAct().filter(a=>a.d.includes(5)&&!have.has(a.id)).forEach(a=>S.acts.push(a));S.v=2;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('تعذّر الحفظ على الجهاز')}}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=(d,i)=>{const x=new Date(d);x.setDate(x.getDate()+i);return x};
const nowM=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const todayK=()=>dk(new Date()),dlab=d=>d.toLocaleDateString('ar',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
let cur=new Date(),tab='home',jt='lang',sp='w';cur.setHours(0,0,0,0);
const actsOn=d=>S.acts.filter(a=>a.d.includes(d.getDay())).sort((a,b)=>a.s-b.s);
const L=(k,id)=>(S.log[k]||{})[id]||{};
const setL=(k,a,o)=>{S.log[k]=S.log[k]||{};S.log[k][a.id]=Object.assign({t:a.t,c:a.c,pl:a.e-a.s},S.log[k][a.id]||{},o);save()};
const bar=p=>`<div class=bar><i style="width:${p||0}%"></i></div>`;
function dayPct(d){const k=dk(d),as=actsOn(d),tot=as.length+S.hab.length;if(!tot)return null;const dn=as.filter(a=>L(k,a.id).st==='done').length+S.hab.filter(h=>(S.hl[k]||{})[h.id]).length;return Math.round(100*dn/tot)}
function mins(f,t){const r={},add=(c,v)=>{r[c]=(r[c]||0)+v};for(const k in S.log){if(k<f||k>t)continue;for(const id in S.log[k]){const x=S.log[k][id];if(x.st==='done')add(x.c,x.am!=null?x.am:x.pl)}}S.jr.forEach(j=>{if(j.k>=f&&j.k<=t&&j.m&&j.c!=='gym')add(j.c,j.m)});return r}
function gdays(f,t,c){const s=new Set();for(const k in S.log){if(k>=f&&k<=t)for(const id in S.log[k]){const x=S.log[k][id];if(x.st==='done'&&x.c===c)s.add(k)}}S.jr.forEach(j=>{if(j.c===c&&j.k>=f&&j.k<=t)s.add(j.k)});return s.size}
function row(a,k){const st=L(k,a.id).st||'todo';return `<div class="row ${st}" onclick="openAct('${a.id}','${k}')"><input type=checkbox ${st==='done'?'checked':''} onclick="event.stopPropagation();tg('${a.id}','${k}',this.checked)"><span class=ic>${CATS[a.c][0]}</span><div class=g><b>${esc(a.t)}</b><small><span dir=ltr>${fm(a.s)} – ${fm(a.e)}</span>${a.mod?' · '+a.mod+(a.k?' '+a.k:''):''}</small></div><span class="tag t-${st}">${ST[st]}</span></div>`}
function tg(id,k,c){setL(k,S.acts.find(z=>z.id===id),{st:c?'done':'todo'});render()}
function hb(id,c){const k=todayK();S.hl[k]=S.hl[k]||{};S.hl[k][id]=c;save();render()}
function home(){const n=new Date(),k=dk(n),nm=nowM(),as=actsOn(n),cu=as.filter(a=>a.s<=nm&&nm<a.e),up=as.filter(a=>a.s>nm&&L(k,a.id).st!=='done').slice(0,4),p=dayPct(n)||0,ws=[];
for(let i=0;i<7;i++){const q=dayPct(addD(n,-i));if(q!==null)ws.push(q)}
const wp=ws.length?Math.round(ws.reduce((a,b)=>a+b,0)/ws.length):0,g=S.gp[n.getDay()];
return `<div class=hero><div id=clk class=clk>${n.toLocaleTimeString('en-GB')}</div><div>${dlab(n)}</div></div>
<div class=card><b>إنجاز اليوم: ${p}%</b>${bar(p)}<small>إنجاز الأسبوع: ${wp}%</small></div>
<div class=card>🏋️ رياضة اليوم: <b>${g||'راحة'}</b></div>
${cu.length?'<h3>الآن</h3>'+cu.map(a=>row(a,k)).join(''):''}
<h3>المهام القادمة</h3>${up.map(a=>row(a,k)).join('')||'<p class=mu>لا توجد مهام قادمة اليوم</p>'}
<h3>العادات اليومية</h3>${S.hab.map(h=>`<label class="card ck"><input type=checkbox ${(S.hl[k]||{})[h.id]?'checked':''} onchange="hb('${h.id}',this.checked)"> ${esc(h.t)}</label>`).join('')}`}
function mv(i){cur=addD(cur,i);render()}
function toToday(){cur=new Date();cur.setHours(0,0,0,0);render()}
function goD(k){cur=new Date(k+'T00:00:00');tab='sch';render();scrollTo(0,0)}
function sch(){const k=dk(cur),as=actsOn(cur),p=dayPct(cur);
return `<div class=nv><button onclick="mv(-1)">›</button><div style="text-align:center"><b>${dlab(cur)}</b><br><small>${k===todayK()?'اليوم · ':''}إنجاز ${p===null?'—':p+'%'}</small></div><button onclick="mv(1)">‹</button></div>
<div class=rw><button onclick="toToday()">اليوم</button><button class=pb onclick="editAct('')">+ نشاط جديد</button></div>
${as.map(a=>row(a,k)).join('')||'<p class=mu>لا أنشطة في هذا اليوم</p>'}`}
function sheet(h){$('#sh').innerHTML='<div class=ov onclick="closeSh()"><div class=box onclick="event.stopPropagation()">'+h+'</div></div>'}
function closeSh(){$('#sh').innerHTML=''}
function cf(b,f){if(b.dataset.s)f();else{b.dataset.s=1;b.textContent='اضغط مرة أخرى للتأكيد'}}
function openAct(id,k){const a=S.acts.find(z=>z.id===id),x=L(k,id);
sheet(`<h3>${esc(a.t)}</h3><small><span dir=ltr>${fm(a.s)} – ${fm(a.e)}</span></small>
<div class=seg>${Object.keys(ST).map(s=>`<button class="${(x.st||'todo')===s?'on':''}" onclick="ss('${id}','${k}','${s}')">${ST[s]}</button>`).join('')}</div>
<label>الوقت الفعلي (دقيقة)<input id=am type=number min=0 value="${x.am!=null?x.am:''}" placeholder="${a.e-a.s}"></label>
<label>ملاحظة قصيرة<input id=nt maxlength=200 value="${esc(x.nt||'')}"></label>
<div class=rw><button class=pb onclick="sv('${id}','${k}')">حفظ</button><button onclick="editAct('${id}')">تعديل النشاط</button></div>`)}
function ss(id,k,s){const a=S.acts.find(z=>z.id===id),x=L(k,id),o={st:s};if(s==='doing')o.t0=Date.now();if(s==='done'&&x.t0&&x.am==null)o.am=Math.max(1,Math.round((Date.now()-x.t0)/60000));setL(k,a,o);render();openAct(id,k)}
function sv(id,k){const a=S.acts.find(z=>z.id===id),v=$('#am').value;setL(k,a,{am:v===''?null:+v,nt:$('#nt').value.trim()});closeSh();render()}
function editAct(id){const a=id?S.acts.find(z=>z.id===id):{t:'',c:'study',s:m(16),e:m(17),d:[...SD],n:true,mod:'',k:''};
sheet(`<h3>${id?'تعديل نشاط':'نشاط جديد'}</h3>
<label>الاسم<input id=et value="${esc(a.t)}"></label>
<label>النوع<select id=ec>${Object.keys(CATS).map(c=>`<option value=${c} ${a.c===c?'selected':''}>${CATS[c][0]} ${CATS[c][1]}</option>`).join('')}</select></label>
<div class=rw><label>البداية<input id=es type=time value="${fm(a.s)}" oninput="dsync()"></label><label>النهاية<input id=ee type=time value="${fm(a.e)}" oninput="dsync()"></label><label>المدة (د)<input id=edu type=number min=1 value="${a.e-a.s}" oninput="esync()"></label></div>
<div class=rw><label>المقياس<select id=em><option value="">—</option>${MODS.map(x=>`<option ${a.mod===x?'selected':''}>${x}</option>`).join('')}</select></label><label>المهمة<select id=ek><option value="">—</option>${KINDS.map(x=>`<option ${a.k===x?'selected':''}>${x}</option>`).join('')}</select></label></div>
<div class=chips id=edd>${DAYS.map((n,i)=>`<button class="${a.d.includes(i)?'on':''}" data-i=${i} onclick="this.classList.toggle('on')">${n}</button>`).join('')}</div>
<div class=rw><button onclick="pre([0,1,2,3,4])">أيام الدراسة</button><button onclick="pre([5,6])">العطلة</button><button onclick="pre([0,1,2,3,4,5,6])">كل يوم</button></div>
<label class=ck><input id=en type=checkbox ${a.n?'checked':''}> تفعيل التنبيه لهذا النشاط</label>
<div class=rw><button class=pb onclick="svAct('${id}')">حفظ</button>${id?`<button class=dg onclick="cf(this,()=>delAct('${id}'))">حذف</button>`:''}</div>`)}
function dsync(){const d=pt($('#ee').value)-pt($('#es').value);if(d>0)$('#edu').value=d}
function esync(){const e=pt($('#es').value)+(+$('#edu').value||0);if(e<1440)$('#ee').value=fm(e)}
function pre(a){document.querySelectorAll('#edd button').forEach(b=>b.classList.toggle('on',a.includes(+b.dataset.i)))}
function svAct(id){const t=$('#et').value.trim(),s=pt($('#es').value),e=pt($('#ee').value),d=[...document.querySelectorAll('#edd button.on')].map(b=>+b.dataset.i);
if(!t)return toast('اكتب اسم النشاط');if(isNaN(s)||isNaN(e)||e<=s)return toast('وقت النهاية يجب أن يكون بعد البداية');if(!d.length)return toast('اختر يوماً واحداً على الأقل');
const o={t,c:$('#ec').value,s,e,d,n:$('#en').checked,mod:$('#em').value,k:$('#ek').value};
if(id)Object.assign(S.acts.find(z=>z.id===id),o);else S.acts.push(Object.assign({id:'a'+Date.now()},o));save();closeSh();render()}
function delAct(id){S.acts=S.acts.filter(z=>z.id!==id);save();closeSh();render()}
function sj(t){jt=t;render()}
function logT(){const c={lang:'language',tech:'tech',gym:'gym'}[jt],list=S.jr.filter(j=>j.c===c).reverse().slice(0,30),
sg={lang:['الفرنسية','الإنجليزية'],tech:['Windows Server','RAID وإدارة الأقراص والتخزين'],gym:['Bench Press','Squat','Deadlift','Shoulder Press']}[jt],n=new Date(),f=dk(new Date(n.getFullYear(),n.getMonth(),1));
const form=jt==='gym'?`<label>التمرين<input id=lt list=dlist></label><div class=rw><label>التصنيف<select id=lty><option>Upper</option><option>Lower</option></select></label><label>الوزن (كغ)<input id=lw type=number step=any></label></div><div class=rw><label>التكرارات<input id=lr type=number></label><label>المجموعات<input id=ls type=number></label></div>`
:`<label>${jt==='lang'?'اللغة / الدرس':'الموضوع / التطبيق العملي'}<input id=lt list=dlist></label><div class=rw><label>المدة (دقيقة)<input id=lm type=number min=0></label></div><label>ما تعلمته<input id=ln></label>`;
return `<div class=seg>${[['lang','اللغات'],['tech','التقني'],['gym','الجيم']].map(x=>`<button class="${jt===x[0]?'on':''}" onclick="sj('${x[0]}')">${x[1]}</button>`).join('')}</div>
${jt==='lang'?`<div class=card>أيام الدراسة هذا الشهر: <b>${gdays(f,todayK(),'language')}</b></div>`:''}${jt==='gym'?`<div class=card>برنامج اليوم: <b>${S.gp[n.getDay()]||'راحة'}</b> · حصص هذا الشهر: <b>${gdays(f,todayK(),'gym')}</b></div>`:''}
<div class=card><datalist id=dlist>${sg.map(s=>`<option value="${s}">`).join('')}</datalist>${form}<button class=pb style="width:100%" onclick="addJ()">إضافة إلى سجل اليوم</button></div>
<h3>آخر التسجيلات</h3>${list.map(j=>`<div class=row style="cursor:default"><div class=g><b>${esc(j.t)}</b><small>${j.k} · ${j.c==='gym'?esc(j.ty)+' · '+j.w+' كغ × '+j.r+' × '+j.s:(j.m||0)+' د'+(j.n?' · '+esc(j.n):'')}</small></div><button onclick="dj('${j.id}')">✕</button></div>`).join('')||'<p class=mu>لا تسجيلات بعد</p>'}`}
function addJ(){const t=$('#lt').value.trim();if(!t)return toast('اكتب الاسم أولاً');const o={id:'j'+Date.now(),k:todayK(),c:{lang:'language',tech:'tech',gym:'gym'}[jt],t};
if(jt==='gym'){o.ty=$('#lty').value;o.w=+$('#lw').value||0;o.r=+$('#lr').value||0;o.s=+$('#ls').value||0}else{o.m=+$('#lm').value||0;o.n=$('#ln').value.trim()}S.jr.push(o);save();render()}
function dj(id){S.jr=S.jr.filter(j=>j.id!==id);save();render()}
function stats(){const n=new Date(),nd=sp==='w'?7:30,f=dk(addD(n,-(nd-1))),t=dk(n),r=mins(f,t),h=c=>((r[c]||0)/60).toFixed(1),v=[];
for(let i=nd-1;i>=0;i--)v.push(dayPct(addD(n,-i)));
const w=300/nd,svg=`<svg viewBox="0 0 300 110" style="width:100%"><line x1="0" y1="100" x2="300" y2="100" stroke="var(--bd)"/>${v.map((p,i)=>p===null?'':`<rect x="${i*w+1}" y="${100-p*0.9}" width="${w-2}" height="${p*0.9}" rx="2" fill="var(--pr)"/>`).join('')}</svg>`;
const rt={};for(let i=0;i<14;i++){const d=addD(n,-i),k=dk(d);actsOn(d).forEach(a=>{const o=rt[a.id]=rt[a.id]||{t:a.t,s:0,d:0};o.s++;if(L(k,a.id).st==='done')o.d++})}
const rl=Object.values(rt).map(o=>({t:o.t,p:Math.round(100*o.d/o.s)})).sort((a,b)=>b.p-a.p),rr=o=>`<div class=card>${esc(o.t)} — <b>${o.p}%</b></div>`,dp=dayPct(n)||0,hist=[];
for(let i=0;i<30;i++){const d=addD(n,-i),p=dayPct(d);hist.push(`<div class=row onclick="goD('${dk(d)}')"><div class=g><b>${d.toLocaleDateString('ar',{weekday:'short',day:'numeric',month:'short'})}</b></div><b>${p===null?'—':p+'%'}</b></div>`)}
return `<div class=seg><button class="${sp==='w'?'on':''}" onclick="sp='w';render()">الأسبوع</button><button class="${sp==='m'?'on':''}" onclick="sp='m';render()">الشهر</button></div>
<div class=card><b>إنجاز اليوم: ${dp}%</b>${bar(dp)}</div>
<div class=rw><div class=card>📚 <b>${h('study')}</b> س<br><small>دراسة جامعية</small></div><div class=card>🗣️ <b>${h('language')}</b> س<br><small>تعلم اللغات</small></div></div>
<div class=rw><div class=card>💻 <b>${h('tech')}</b> س<br><small>تعلم تقني</small></div><div class=card>🏋️ <b>${gdays(f,t,'gym')}</b> حصة<br><small>رياضة</small></div></div>
<h3>تقدّم ${sp==='w'?'أسبوعي':'شهري'}</h3><div class=card>${svg}</div>
<h3>الأكثر التزاماً (آخر 14 يوماً)</h3>${rl.slice(0,3).map(rr).join('')||'<p class=mu>—</p>'}
<h3>الأقل التزاماً</h3>${rl.slice(-3).reverse().map(rr).join('')||'<p class=mu>—</p>'}
<h3>سجل الأيام السابقة</h3>${hist.join('')}`}
function settings(){const s=S.set,np='Notification' in window?Notification.permission:'غير مدعوم';
return `<h3>التنبيهات</h3><div class=card>
<label class=ck><input type=checkbox ${s.notif?'checked':''} onchange="S.set.notif=this.checked;save()"> تفعيل التنبيهات</label>
<label>التنبيه قبل البدء بـ (دقيقة)<input type=number min=0 value="${s.lead}" onchange="S.set.lead=+this.value||0;save()"></label>
<label class=ck><input type=checkbox ${s.quiet?'checked':''} onchange="S.set.quiet=this.checked;save()"> إيقاف التنبيهات وقت النوم</label>
<div class=rw><label>من<input type=time value="${s.qs}" onchange="S.set.qs=this.value;save()"></label><label>إلى<input type=time value="${s.qe}" onchange="S.set.qe=this.value;save()"></label></div>
<button style="width:100%" onclick="askN()">السماح بإشعارات المتصفح (الحالة: ${np})</button>
<small>التنبيهات تعمل أثناء فتح التطبيق. لتعطيل تنبيه نشاط معيّن عدّل النشاط.</small></div>
<h3>العادات اليومية</h3>${S.hab.map(h=>`<div class=row style="cursor:default"><div class=g>${esc(h.t)}</div><button onclick="dh('${h.id}')">✕</button></div>`).join('')}
<div class=rw><input id=nh placeholder="عادة جديدة"><button class=pb onclick="addH()">إضافة</button></div>
<h3>برنامج الجيم الأسبوعي</h3><div class=card>${DAYS.map((d,i)=>`<div class=nv><span>${d}</span><select style="width:50%" onchange="S.gp[${i}]=this.value;save()"><option value="">راحة</option><option ${S.gp[i]==='Upper'?'selected':''}>Upper</option><option ${S.gp[i]==='Lower'?'selected':''}>Lower</option></select></div>`).join('')}</div>
<h3>النسخ الاحتياطي</h3><div class=card><textarea id=bk rows=5 placeholder="هنا تظهر النسخة، أو الصق نسخة سابقة لاسترجاعها"></textarea>
<div class=rw><button class=pb onclick="expB()">تصدير</button><button onclick="impB()">استرجاع</button></div></div>
<h3>إعادة الضبط</h3><button class=dg onclick="cf(this,()=>{S.acts=defAct();save();render()})">استرجاع الجدول الافتراضي</button>`}
function askN(){try{Notification.requestPermission().then(render)}catch(e){toast('غير مدعوم في هذا المتصفح')}}
function addH(){const t=$('#nh').value.trim();if(!t)return;S.hab.push({id:'h'+Date.now(),t});save();render()}
function dh(id){S.hab=S.hab.filter(h=>h.id!==id);save();render()}
function expB(){const b=$('#bk');b.value=JSON.stringify(S);b.select();try{navigator.clipboard.writeText(b.value).then(()=>toast('تم النسخ. الصقه في ملاحظات واحفظه'),()=>toast('انسخ النص يدوياً'))}catch(e){toast('انسخ النص يدوياً')}}
function impB(){try{const o=JSON.parse($('#bk').value);if(!o.acts||!o.set)throw 0;S=o;save();toast('تم الاسترجاع');render()}catch(e){toast('النسخة غير صالحة')}}
const TABS=[['home','🏠','الرئيسية',home],['sch','🗓️','الجدول',sch],['log','📝','السجل',logT],['st','📊','الإحصائيات',stats],['set','⚙️','الإعدادات',settings]];
function render(){const y=scrollY;$('#v').innerHTML=TABS.find(x=>x[0]===tab)[3]();$('#nav').innerHTML=TABS.map(x=>`<button class="${tab===x[0]?'on':''}" onclick="tab='${x[0]}';render();scrollTo(0,0)"><i>${x[1]}</i>${x[2]}</button>`).join('');scrollTo(0,y)}
function hideT(){$('#toast').style.display='none'}
function toast(t,a){const e=$('#toast');e.innerHTML='<span>'+esc(t)+'</span>'+(a?`<button onclick="snz('${a.id}')">تأجيل 10 د</button>`:'')+'<button onclick="hideT()">✕</button>';e.style.display='flex';clearTimeout(toast.h);toast.h=setTimeout(hideT,a?20000:3000)}
const inQ=x=>{const a=pt(S.set.qs),b=pt(S.set.qe);return a<b?x>=a&&x<b:x>=a||x<b};
function alertUser(msg,a){try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}try{if('Notification' in window&&Notification.permission==='granted'){if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification('My Daily Tracker',{body:msg,icon:'icon-192.png',vibrate:[200,100,200]}));else new Notification('My Daily Tracker',{body:msg})}}catch(e){}toast(msg,a)}
function snz(id){hideT();const a=S.acts.find(z=>z.id===id);setTimeout(()=>{if(!(S.set.quiet&&inQ(nowM())))alertUser('تذكير: '+a.t,a)},600000)}
const fired={};let lastD=todayK();
function tick(){const n=new Date(),nm=nowM(),k=dk(n),c=$('#clk');if(c)c.textContent=n.toLocaleTimeString('en-GB');
if(k!==lastD){lastD=k;if(tab==='home')render()}
if(!S.set.notif||(S.set.quiet&&inQ(nm)))return;
actsOn(n).forEach(a=>{if(!a.n||L(k,a.id).st==='done')return;[[a.s-S.set.lead,'قريباً: '],[a.s,'حان وقت: ']].forEach(x=>{const f=k+a.id+x[0];if(nm===x[0]&&!fired[f]){fired[f]=1;alertUser(x[1]+a.t,a)}})})}
render();setInterval(tick,1000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
